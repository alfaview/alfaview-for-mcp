# Publishes the package to npm when a version tag, such as 1.2.3, reaches this
# repository.
#
# Two jobs, so that no code of a dependency runs where the OIDC token is:
# - gates: checks that the tag is the version of package.json, runs the gates
#   of ci.yml, packs the package and uploads the tarball for one day. It has
#   no OIDC token. The install runs no install script of a dependency
#   (--ignore-scripts), but typecheck, test, build and pack run code of the
#   dependencies.
# - publish: downloads that tarball and publishes it. It checks out nothing,
#   installs nothing and runs no code of a dependency. npm runs no lifecycle
#   script when it publishes a tarball. Only this job has id-token: write:
#   each step of a job can get the OIDC token of the job, and trusted
#   publishing trades that token for a publish token of the package.
#
# npm access:
# - Trusted publishing: the trusted publisher of the package on npmjs.com names
#   this repository and the workflow publish.yml. npm takes the OIDC token of
#   the job publish and adds the provenance statement. The repository holds no
#   npm token.
# - The first publish of the package: npm sets up a trusted publisher only for
#   a package that exists. For that publish, a maintainer puts a granular npm
#   token of one day into the secret NPM_TOKEN of the environment npm, never
#   into a secret of the repository. The job publish then publishes with that
#   token and --provenance. After the publish, the maintainer deletes the
#   secret and the token.
# - The trusted publisher: a new one expires when it does not publish within
#   2 days, and one that npm creates after 2026-09-03 allows only npm stage
#   publish by default. So a maintainer sets it up at most 2 days before the
#   tag of the second release, and allows npm publish in it. It names the
#   environment npm.
#
# The environment npm: the job publish runs in it. A maintainer creates it
# before the first tag, because a workflow that names an environment that does
# not exist creates it with no protection rules. Only a tag that matches *.*.*
# deploys to it, a maintainer approves each run of the job publish, and no
# administrator bypasses these rules. The job gets the secrets of the
# environment only after the approval.
#
# Both jobs run on GitHub-hosted runners: npm supports trusted publishing and
# provenance there, not on a self-hosted runner.
#
# Every action is pinned to a full commit SHA, with its version in a comment.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

# Read only for each job that names no permissions of its own.
permissions:
  contents: read

jobs:
  gates:
    name: Gates and pack
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 22, as in ci.yml: the oldest major version that engines of
          # package.json allows.
          node-version: '22'
          # No dependency cache in a job whose tarball goes to npm.
          package-manager-cache: false

      - name: Check the tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not the version $version of package.json." >&2
            exit 1
          fi

      - name: Install the dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: gates
    runs-on: ubuntu-latest
    # The approval of a maintainer, the rule for the tags and the npm token of
    # the first publish.
    environment: npm

    permissions:
      # The OIDC token of trusted publishing and of the provenance statement.
      id-token: write
      contents: read

    steps:
      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24: setup-node takes the 24.x of the runner image, or the
          # newest 24.x when the image has none. Trusted publishing needs npm
          # 11.5.1 or later, which Node 24.5.0 and later bring.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check the tarball
        # The artifact must hold only the file that npm pack writes for this
        # package and the tag, with the name, the version and the publishConfig
        # of this package. So a changed build cannot publish another package,
        # another version or to another registry. The path starts with ./,
        # because npm reads package/<file> as a repository on GitHub.
        env:
          PACKAGE_NAME: '@alfaview-integrations/alfaview-for-mcp'
          PACKAGE_FILE: 'alfaview-integrations-alfaview-for-mcp'
          PUBLISH_CONFIG: '{"access":"public"}'
        run: |
          tarball="./package/$PACKAGE_FILE-$GITHUB_REF_NAME.tgz"
          count="$(find ./package -mindepth 1 | wc -l | tr -d ' ')"
          if [ "$count" -ne 1 ] || [ ! -f "$tarball" ]; then
            echo "The artifact does not hold only $tarball." >&2
            exit 1
          fi
          tar -xzOf "$tarball" package/package.json | node -e '
            const manifest = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const problems = [];
            if (manifest.name !== process.env.PACKAGE_NAME) problems.push(`the name ${manifest.name}`);
            if (manifest.version !== process.env.GITHUB_REF_NAME) problems.push(`the version ${manifest.version}`);
            if (JSON.stringify(manifest.publishConfig) !== process.env.PUBLISH_CONFIG) problems.push(`publishConfig ${JSON.stringify(manifest.publishConfig)}`);
            if (problems.length > 0) {
              console.error(`The tarball is not ${process.env.PACKAGE_NAME}@${process.env.GITHUB_REF_NAME}: ${problems.join(", ")}.`);
              process.exit(1);
            }
          '
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish "$TARBALL" --access public --provenance
          else
            npm publish "$TARBALL" --access public
          fi
